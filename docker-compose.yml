services:
  vehicle-api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      SIM_AUTO_UPDATE: "1"
      SIM_TICK_SECONDS: "0.1"
    # Mount the source and reload on changes for local development.
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
